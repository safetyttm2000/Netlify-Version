<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TTM - ระบบอบรมความปลอดภัย</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>
*{font-family:'Sarabun',sans-serif;box-sizing:border-box;}
body{margin:0;min-height:100vh;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);
  display:flex;align-items:center;justify-content:center;overflow:hidden;}
.grid{position:fixed;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(192,57,43,.07) 1px,transparent 1px),
  linear-gradient(90deg,rgba(192,57,43,.07) 1px,transparent 1px);
  background-size:60px 60px;animation:gm 20s linear infinite;}
@keyframes gm{to{background-position:0 60px}}
.card{position:relative;z-index:1;background:rgba(255,255,255,.06);backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.13);border-radius:22px;padding:42px 38px;
  width:100%;max-width:440px;margin:16px;box-shadow:0 24px 64px rgba(0,0,0,.5);
  animation:up .6s cubic-bezier(.23,1,.32,1);}
@keyframes up{from{opacity:0;transform:translateY(32px)}to{opacity:1;transform:none}}
.logo{text-align:center;margin-bottom:24px;}
.logo img{height:58px;filter:drop-shadow(0 0 16px rgba(192,57,43,.6));}
.title{color:#fff;font-size:15px;font-weight:700;margin-top:12px;line-height:1.55;}
.sub{color:rgba(255,255,255,.4);font-size:12px;margin-top:3px;}
.langs{display:flex;gap:7px;justify-content:center;margin-bottom:14px;}
.lb{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);
  border-radius:7px;color:rgba(255,255,255,.5);font-size:12px;font-weight:700;
  padding:5px 14px;cursor:pointer;font-family:'Sarabun',sans-serif;}
.lb.on{background:#C0392B;border-color:#C0392B;color:#fff;}
.div{display:flex;align-items:center;gap:10px;margin:12px 0;}
.dl{flex:1;height:1px;background:rgba(255,255,255,.13);}
.dt{color:rgba(255,255,255,.35);font-size:12px;}
.err{background:rgba(192,57,43,.18);border:1px solid rgba(192,57,43,.35);
  border-radius:9px;color:#ff8880;font-size:13px;padding:10px 14px;margin-bottom:12px;display:none;}
.lbl{color:rgba(255,255,255,.7);font-size:13px;font-weight:600;margin-bottom:6px;display:block;}
.inp{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);border-radius:11px;
  color:#fff;padding:12px 15px;font-size:14px;width:100%;font-family:'Sarabun',sans-serif;}
.inp:focus{outline:none;border-color:#C0392B;background:rgba(255,255,255,.11);
  box-shadow:0 0 0 3px rgba(192,57,43,.2);}
.inp::placeholder{color:rgba(255,255,255,.25);}
.pw-wrap{display:flex;margin-bottom:16px;}
.pw-wrap .inp{border-radius:11px 0 0 11px;flex:1;}
.eye{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);border-left:none;
  border-radius:0 11px 11px 0;color:rgba(255,255,255,.45);padding:0 14px;cursor:pointer;}
.eye:hover{color:#fff;}
.btn-go{width:100%;background:linear-gradient(135deg,#C0392B,#922B21);border:none;
  border-radius:11px;color:#fff;font-size:15px;font-weight:700;padding:13px;
  cursor:pointer;font-family:'Sarabun',sans-serif;margin-top:4px;}
.btn-go:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 10px 28px rgba(192,57,43,.45);}
.btn-go:disabled{opacity:.5;cursor:not-allowed;}
.foot{text-align:center;color:rgba(255,255,255,.2);font-size:11px;margin-top:18px;}
</style>
</head>
<body>
<div class="grid"></div>
<div class="card">
  <div class="logo">
    <img src="https://ttm-jda.com/themes/default/images/all/logo/pic_logo.png" alt="TTM"
         onerror="this.style.display='none'">
    <div class="title" id="sysT">ระบบอบรมข้อกำหนดด้านความปลอดภัย<br>สำหรับผู้รับเหมาฯ TTM</div>
    <div class="sub">Safety Training System for Contractors</div>
  </div>
  <div class="langs">
    <button class="lb on" onclick="setLang('th')" id="bTH">🇹🇭 ไทย</button>
    <button class="lb"    onclick="setLang('en')" id="bEN">🇺🇸 English</button>
  </div>
  <div class="div"><div class="dl"></div><div class="dt" id="divT">เข้าสู่ระบบ</div><div class="dl"></div></div>
  <div class="err" id="err"><i class="fas fa-exclamation-circle me-2"></i><span id="errTxt"></span></div>
  <div style="margin-bottom:12px;">
    <label class="lbl"><i class="fas fa-user me-2"></i><span id="lU">ชื่อผู้ใช้</span></label>
    <input class="inp" type="text" id="uname" autocomplete="username"
      onkeydown="if(event.key==='Enter')document.getElementById('pw').focus()">
  </div>
  <div class="pw-wrap">
    <input class="inp" type="password" id="pw" autocomplete="current-password"
      onkeydown="if(event.key==='Enter')doLogin()">
    <button class="eye" onclick="togglePw()"><i class="fas fa-eye" id="eyeI"></i></button>
  </div>
  <button class="btn-go" id="btn" onclick="doLogin()">
    <span id="btnTxt"><i class="fas fa-sign-in-alt me-2"></i><span id="btnLbl">เข้าสู่ระบบ</span></span>
  </button>
  <div class="foot">© TTM Safety Training System</div>
</div>
<script src="ttm-api.js"></script>
<script>
var lang='th';
var TX={
  th:{sys:'ระบบอบรมข้อกำหนดด้านความปลอดภัย<br>สำหรับผู้รับเหมาฯ TTM',div:'เข้าสู่ระบบ',
      lU:'ชื่อผู้ใช้',btn:'เข้าสู่ระบบ',uph:'กรอกชื่อผู้ใช้',pph:'กรอกรหัสผ่าน',
      loading:'กำลังตรวจสอบ...',eEmpty:'กรุณากรอกชื่อผู้ใช้และรหัสผ่าน',
      eBad:'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง',eConn:'เกิดข้อผิดพลาดในการเชื่อมต่อ'},
  en:{sys:'Safety Training System<br>for Contractors TTM',div:'Login',
      lU:'Username',btn:'Sign In',uph:'Enter username',pph:'Enter password',
      loading:'Verifying...',eEmpty:'Please enter username and password',
      eBad:'Invalid username or password',eConn:'Connection error'}
};
function setLang(l){
  lang=l; localStorage.setItem('ttm_lang',l);
  var t=TX[l];
  document.getElementById('sysT').innerHTML=t.sys;
  document.getElementById('divT').textContent=t.div;
  document.getElementById('lU').textContent=t.lU;
  document.getElementById('btnLbl').textContent=t.btn;
  document.getElementById('uname').placeholder=t.uph;
  document.getElementById('pw').placeholder=t.pph;
  document.getElementById('bTH').classList.toggle('on',l==='th');
  document.getElementById('bEN').classList.toggle('on',l==='en');
}
function togglePw(){
  var p=document.getElementById('pw'),i=document.getElementById('eyeI');
  p.type=p.type==='password'?'text':'password';
  i.className='fas fa-eye'+(p.type==='text'?'-slash':'');
}
function showErr(m){
  var e=document.getElementById('err');
  document.getElementById('errTxt').textContent=m;
  e.style.display='block';
  e.style.animation='none'; void e.offsetWidth;
  e.style.animation='shake .4s ease';
}
async function doLogin(){
  var u=document.getElementById('uname').value.trim();
  var p=document.getElementById('pw').value;
  if(!u||!p){showErr(TX[lang].eEmpty);return;}
  document.getElementById('err').style.display='none';
  var btn=document.getElementById('btn'); btn.disabled=true;
  document.getElementById('btnTxt').innerHTML='<span class="spinner-border spinner-border-sm me-2"></span>'+TX[lang].loading;
  try{
    var res=await apiLogin(u,p);
    btn.disabled=false;
    document.getElementById('btnTxt').innerHTML='<i class="fas fa-sign-in-alt me-2"></i>'+TX[lang].btn;
    if(res&&res.success){
      saveSession({token:res.token,username:res.username,displayName:res.displayName,role:res.role,lang:lang});
      window.location.href=res.role==='admin'?'admin.html':'user.html';
    } else showErr((res&&res.message)||TX[lang].eBad);
  }catch(e){
    btn.disabled=false;
    document.getElementById('btnTxt').innerHTML='<i class="fas fa-sign-in-alt me-2"></i>'+TX[lang].btn;
    showErr(TX[lang].eConn+': '+e.message);
  }
}
window.addEventListener('load',function(){
  var s=getSession();
  if(s&&s.token) window.location.href=s.role==='admin'?'admin.html':'user.html';
  setLang(localStorage.getItem('ttm_lang')||'th');
  document.getElementById('uname').focus();
});
</script>
<style>
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
</style>
</body>
</html>
